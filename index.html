<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guitar Songbook</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Songbook"><meta name="theme-color" content="#16181d">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-512.png">

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a tidy practice binder; short plain words, bold for the one thing that matters
   IDEA: a songbook with index tabs: each song is a spine you pull out; the tuner is the clip-on on the headstock
   PICTURE: song spines in a list (title big, tuning badge, chord strip) and the tuner dial
   COLOUR and TYPE: white, ink, one teal accent for "in tune"; blue low, orange high (same as Strum & Sing); Lexend
   LAYOUT: one 760px column, two big tabs at top, stacked on phones */
:root{color-scheme:light dark;--bg:light-dark(#fff,#121417);--ink:light-dark(#16181d,#eef0f3);--muted:light-dark(#5f6470,#a6acb8);
--line:light-dark(#e2e4e9,#2b2f37);--panel:light-dark(#f5f6f8,#1b1e24);--panel2:light-dark(#eceef2,#252932);
--ok:light-dark(#0b8a7a,#3ccbb4);--okbg:light-dark(#e2f4f1,#123a34);--low:light-dark(#2a62d4,#7aa4ff);--high:light-dark(#d4531c,#ff8d58);--wood:light-dark(#5b2a1e,#c08a63)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Lexend,system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:clamp(20px,4vw,44px) max(4vw,16px)}
h1{font-size:clamp(32px,6vw,44px);line-height:1.05;margin:0}
h2{font-size:22px;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
b{font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel);padding:6px;border-radius:16px;margin:20px 0}
.tabs button{min-height:48px;border:0;border-radius:12px;background:transparent;font-weight:600;cursor:pointer}
.tabs a{display:grid;place-items:center;min-height:48px;border-radius:12px;font-weight:600;text-decoration:none;color:inherit}
.tabs button[aria-selected=true]{background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--bg);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.on{background:var(--high);border-color:var(--high);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hidden{display:none!important}.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* songs */
.search{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;background:var(--bg)}
.song{border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px;display:grid;gap:10px}
.song .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.song h3{font-size:24px;line-height:1.15;margin:0}
.song .who{color:var(--muted)}
.badge{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--panel);white-space:nowrap}
.badge.flat{background:var(--okbg);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:14px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.facts{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted)}
.strum{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;background:var(--panel);border-radius:12px;padding:10px 14px}.strum span{font-size:14px;color:var(--muted)}.strum b{font-size:22px;letter-spacing:.12em}
.empty{color:var(--muted);text-align:center;padding:30px 0}
details.add{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
details.add summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.form{display:grid;gap:10px;margin-top:8px}
.form input{min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:var(--bg)}
/* tuner (from Strum & Sing) */
.tuner{display:grid;place-items:center;padding:8px 0 4px}
.tuner svg{width:min(100%,460px);height:auto;display:block}
.needle{transition:transform .12s linear;transform-origin:200px 210px}
.readout{text-align:center;margin-top:-8px}
.readout .nn{font-size:64px;font-weight:700;line-height:1}
.readout .hint{font-size:20px;font-weight:600;min-height:32px}
.tuneset{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 0}
.tuneset button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;line-height:1.15}
.tuneset button small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tuneset button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tuneset button[aria-pressed=true] small{color:inherit}
.strings{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:12px 0}
.strings button{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;line-height:1.1;font-weight:700;font-size:17px}
.strings button small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.strings button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.strings button[aria-pressed=true] small{color:inherit}
.strings button.good{box-shadow:inset 0 -5px 0 var(--ok)}
.c-ok{color:var(--ok)}.c-low{color:var(--low)}.c-high{color:var(--high)}
.fallback{background:var(--panel);border-radius:16px;padding:16px;margin-top:12px}
.fallback h3{margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:9;max-width:90vw}
@media(max-width:520px){.strings{grid-template-columns:repeat(4,minmax(0,1fr))}.readout .nn{font-size:52px}}
@media(prefers-reduced-motion:reduce){.needle{transition:none}}
</style></head><body>
<div class="wrap">
  <h1>Guitar Songbook</h1>
  <p class="sub">Your song guides in one place, plus a tuner.</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-songs" aria-selected="true">Songs</button>
    <button role="tab" id="t-tune" aria-selected="false">Tuner</button>
    <a id="t-tune-gh" class="hidden" href="https://basic-afk.github.io/Guitar_Book/#tuner" target="_blank" rel="noopener">Tuner ↗</a>
  </div>

  <section id="v-songs">
    <input class="search" id="q" type="search" placeholder="Search songs or artists" aria-label="Search songs">
    <div id="list"></div>
    <details class="add"><summary>+ Add a guide link</summary>
      <form class="form" id="addf">
        <input id="a-title" placeholder="Song title" required>
        <input id="a-artist" placeholder="Artist">
        <input id="a-url" placeholder="Guide link (https://…)" required>
        <label class="row" style="font-size:15px"><input type="checkbox" id="a-flat" style="min-height:auto"> Tuned half a step down</label>
        <button class="btn" type="submit">Add to songbook</button>
        <p class="sub" style="font-size:14px">Saved in this browser only.</p>
      </form>
    </details>
  </section>

  <section id="v-tune" class="hidden">
    <div class="tuneset" id="tset">
      <button data-t="std" aria-pressed="true">Standard<small>E A D G B E</small></button>
      <button data-t="flat" aria-pressed="false">Half step down<small>E♭ A♭ D♭ G♭ B♭ E♭</small></button>
    </div>
    <div class="tuner"><svg viewBox="0 0 400 225" role="img" aria-label="Tuning needle" id="dial"></svg>
      <div class="readout"><div class="nn" id="tn">–</div><div class="sub" id="tc">Pick a string, or just play one</div><div class="hint" id="th" aria-live="polite"></div></div></div>
    <div class="strings" id="strs"></div>
    <div id="lis"></div>
    <div class="row" style="margin-top:10px"><button class="btn alt" id="ref">Hear the string</button></div>
    <p class="sub" style="margin-top:14px">Pluck <b>one string</b> and let it ring. Tune <b>up</b> to the note. Needle jumping? Hold the phone near the sound hole and mute the other strings.</p>
  </section>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
{
const DSP = (() => {
  const NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  const state = { a4: 440 };
  const f2m = (f) => 69 + 12 * Math.log2(f / state.a4);
  const m2f = (m) => state.a4 * Math.pow(2, (m - 69) / 12);
  const pc = (m) => ((Math.round(m) % 12) + 12) % 12;
  const name = (m) => NAMES[pc(m)] + (Math.floor(Math.round(m) / 12) - 1);
  const pcName = (p) => NAMES[((p % 12) + 12) % 12];

  function rms(b, from = 0, to = b.length) {
    let s = 0; for (let i = from; i < to; i++) s += b[i] * b[i];
    return Math.sqrt(s / Math.max(1, to - from));
  }

  /* YIN (de Cheveigné & Kawahara 2002): difference fn -> cumulative mean
     normalised difference -> absolute threshold -> parabolic interpolation */
  let dBuf = new Float32Array(0), cBuf = new Float32Array(0);
  function yin(buf, sr, opt = {}) {
    const fmin = opt.fmin || 60, fmax = opt.fmax || 1100, th = opt.threshold || 0.12;
    const N = buf.length;
    const tauMax = Math.min(Math.floor(sr / fmin), Math.floor(N / 2));
    const tauMin = Math.max(2, Math.floor(sr / fmax));
    const W = N - tauMax;
    if (dBuf.length < tauMax + 2) { dBuf = new Float32Array(tauMax + 2); cBuf = new Float32Array(tauMax + 2); }
    const d = dBuf, c = cBuf;
    for (let t = 1; t <= tauMax; t++) {
      let s = 0;
      for (let j = 0; j < W; j++) { const x = buf[j] - buf[j + t]; s += x * x; }
      d[t] = s;
    }
    c[0] = 1; let run = 0;
    for (let t = 1; t <= tauMax; t++) { run += d[t]; c[t] = run > 0 ? d[t] * t / run : 1; }
    let tau = -1;
    for (let t = tauMin; t < tauMax; t++) {
      if (c[t] < th) { while (t + 1 < tauMax && c[t + 1] < c[t]) t++; tau = t; break; }
    }
    if (tau < 0) { // no dip under threshold: take the first dip close to the deepest one
      let best = tauMin;
      for (let t = tauMin; t < tauMax; t++) if (c[t] < c[best]) best = t;
      if (c[best] > 0.3) return { f0: 0, clarity: 1 - c[best] };
      const lim = c[best] + 0.06;
      for (let t = tauMin; t <= best; t++) if (c[t] < lim) { while (t + 1 < tauMax && c[t + 1] < c[t]) t++; tau = t; break; }
    }
    let bt = tau;
    if (tau > 1 && tau < tauMax) {
      const s0 = c[tau - 1], s1 = c[tau], s2 = c[tau + 1], den = s0 + s2 - 2 * s1;
      if (Math.abs(den) > 1e-12) bt = tau + (s0 - s2) / (2 * den);
    }
    return { f0: sr / bt, clarity: 1 - c[tau] };
  }

  /* CMNDF-only YIN inside a narrow window around an expected pitch.
     Stops sympathetic strings and strong overtones from pulling the reading an octave off. */
  function pitchNear(buf, sr, f, cents = 350) {
    const tLo = Math.max(2, Math.floor(sr / (f * Math.pow(2, cents / 1200)))), tHi = Math.ceil(sr / (f * Math.pow(2, -cents / 1200)));
    const N = buf.length; if (N < 2 * tHi + 2) return { f0: 0, clarity: 0 };
    const W = N - tHi - 1;
    if (dBuf.length < tHi + 2) { dBuf = new Float32Array(tHi + 2); cBuf = new Float32Array(tHi + 2); }
    const d = dBuf, c = cBuf; c[0] = 1; let run = 0;
    for (let t = 1; t <= tHi + 1; t++) { let s = 0; for (let j = 0; j < W; j++) { const x = buf[j] - buf[j + t]; s += x * x; } d[t] = s; run += s; c[t] = run > 0 ? s * t / run : 1; }
    let best = tLo; for (let t = tLo; t <= tHi; t++) if (c[t] < c[best]) best = t;
    let bt = best;
    if (best > tLo && best < tHi + 1) { const s0 = c[best - 1], s1 = c[best], s2 = c[best + 1], den = s0 + s2 - 2 * s1; if (Math.abs(den) > 1e-12) bt = best + (s0 - s2) / (2 * den); }
    return { f0: sr / bt, clarity: 1 - c[best] };
  }
  /* Which of these notes is sounding? Harmonic sum over the spectrum: each candidate
     collects energy at its fundamental and first overtones, so a ringing low string
     can't out-vote the string you actually plucked. */
  function noteScores(buf, sr, midis) {
    const { mag, N } = fftMag(buf);
    let mx = 1e-12; const k0 = Math.floor(60 * N / sr), k1 = Math.min(mag.length - 1, Math.ceil(2500 * N / sr));
    for (let k = k0; k <= k1; k++) if (mag[k] > mx) mx = mag[k];
    const W = [1, 0.85, 0.65, 0.45, 0.3, 0.2];
    const sc = midis.map((m) => { const f = m2f(m), a = []; let s = 0;
      for (let h = 1; h <= 6; h++) { a[h] = bandPeak(mag, N, sr, h * f, 45) / mx; s += W[h - 1] * a[h]; }
      return { m, s, a1: a[1], a }; });
    /* Ambiguity: high E is exactly 3× the A string (and 4× low E), so a ringing low string "contains" it.
       The low string only really sounds if its OWN overtones (the ones the high string can't make) are there. */
    let top = sc.reduce((b, x) => (x.s > b.s ? x : b), sc[0]);
    for (const L of sc) for (const H of sc) {
      if (H.m <= L.m) continue; const k = m2f(H.m) / m2f(L.m), kr = Math.round(k);
      if (kr < 2 || kr > 4 || Math.abs(1200 * Math.log2(k / kr)) > 45) continue;
      if (top !== L && top !== H) continue;
      let uniq = 0; for (let h = 2; h <= 6; h++) if (h % kr && L.a[h] > 0.15) uniq++;
      top = uniq >= 2 || L.a1 >= H.a1 ? L : H; // a really plucked string is loud at its own note, or rings its own overtones
    }
    sc.top = top;
    return sc;
  }
  /* Tuner reading: pick the string (or use the chosen one), then measure precisely near it */
  function stringPitch(buf, sr, strings, fixed = -1) {
    let idx = fixed;
    if (idx < 0) { const sc = noteScores(buf, sr, strings); idx = sc.indexOf(sc.top); if (sc[idx].s < 0.6) return { f0: 0, clarity: 0, idx }; }
    const r = pitchNear(buf, sr, m2f(strings[idx]), fixed < 0 ? 300 : 550);
    return { ...r, idx };
  }

  /* Live tuner: string-aware reading + ignores the fading tail (where other strings ring along)
     + only switches string on a fresh pluck */
  function makeTuner(strings = OPEN) {
    let peak = 0, lock = -1, prevR = 0, pend = -1, pendN = 0; const sm = makeSmoother(5);
    return {
      read(buf, sr, fixed = -1) {
        const r = rms(buf); const onset = r > prevR * 1.6 && r > 0.01; prevR = r;
        peak = Math.max(r, peak * 0.985);
        if (r < Math.max(0.004, peak * 0.18)) { sm.push(0); return { f0: 0, r, why: 'fading' }; }
        let idx = fixed;
        if (idx < 0) {
          const sc = noteScores(buf, sr, strings); const top = sc.indexOf(sc.top);
          if (sc[top].s < 0.6) return { f0: 0, r };
          if (lock < 0 || onset || top === lock) { lock = top; pend = -1; }
          else if (top === pend) { if (++pendN >= 4) { lock = top; pend = -1; } } else { pend = top; pendN = 1; }
          if (lock !== top && sc[lock].s < sc[top].s * 0.35) lock = top;
          idx = lock;
        }
        const y = pitchNear(buf, sr, m2f(strings[idx]), fixed < 0 ? 300 : 550);
        if (y.clarity < 0.6) { sm.push(0); return { f0: 0, r, idx }; }
        // in auto mode a reading at the edge of the window means we picked the wrong string: wait for a better frame
        if (fixed < 0 && Math.abs(f2m(y.f0) - strings[idx]) > 1.5) { lock = -1; sm.push(0); return { f0: 0, r, idx }; }
        return { f0: sm.push(y.f0), r, idx, clarity: y.clarity };
      },
      reset() { peak = 0; lock = -1; sm.reset(); }
    };
  }

  /* Smoother: median of recent readings (in cents) with jump rejection */
  function makeSmoother(size = 5) {
    const hist = []; let miss = 0;
    return {
      push(f0) {
        if (!f0) { if (++miss > 3) hist.length = 0; return hist.length ? median() : 0; }
        miss = 0;
        const m = f2m(f0);
        if (hist.length >= 3) {
          const med = f2m(median());
          // a lone octave jump is usually a detection slip: wait for confirmation
          if (Math.abs(m - med) > 7 && !this._pend) { this._pend = m; return median(); }
          if (this._pend && Math.abs(m - this._pend) > 1) { this._pend = 0; return median(); }
          if (this._pend) { hist.length = 0; this._pend = 0; }
        }
        hist.push(f0); if (hist.length > size) hist.shift();
        return median();
      },
      reset() { hist.length = 0; this._pend = 0; }
    };
    function median() { const s = hist.slice().sort((a, b) => a - b); return s[s.length >> 1]; }
  }

  /* Radix-2 FFT magnitude with Hann window */
  function fftMag(x) {
    let N = 1; while (N < x.length) N <<= 1;
    const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < x.length; i++) re[i] = x[i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (x.length - 1)));
    for (let i = 1, j = 0; i < N; i++) {
      let bit = N >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;
      if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; }
    }
    for (let len = 2; len <= N; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < N; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const a = i + k, b = a + len / 2;
          const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
          const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
        }
      }
    }
    const mag = new Float32Array(N / 2);
    for (let k = 0; k < N / 2; k++) mag[k] = Math.hypot(re[k], im[k]);
    return { mag, N };
  }

  /* Peak energy near a frequency (±cents), from a magnitude spectrum */
  function bandPeak(mag, N, sr, f, cents = 35) {
    const lo = Math.max(1, Math.floor(f * Math.pow(2, -cents / 1200) * N / sr));
    const hi = Math.min(mag.length - 1, Math.ceil(f * Math.pow(2, cents / 1200) * N / sr));
    let m = 0; for (let k = lo; k <= hi; k++) if (mag[k] > m) m = mag[k];
    return m;
  }

  function chroma(mag, N, sr, fmin = 70, fmax = 1500) {
    const ch = new Float64Array(12);
    const k0 = Math.ceil(fmin * N / sr), k1 = Math.floor(fmax * N / sr);
    let floor = 0; for (let k = k0; k <= k1; k++) floor += mag[k]; floor /= (k1 - k0 + 1);
    for (let k = k0; k <= k1; k++) {
      const v = mag[k] - 2 * floor; if (v <= 0) continue;
      const m = f2m(k * sr / N), r = Math.round(m), dev = m - r;
      ch[((r % 12) + 12) % 12] += v * Math.exp(-(dev * dev) / 0.045);
    }
    const mx = Math.max(...ch) || 1;
    return Array.from(ch, (v) => v / mx);
  }

  /* Spectral peaks (parabolic-interpolated) between fmin..fmax */
  function peaks(mag, N, sr, fmin = 70, fmax = 2600) {
    const k0 = Math.max(3, Math.ceil(fmin * N / sr)), k1 = Math.min(mag.length - 3, Math.floor(fmax * N / sr));
    let mx = 0; for (let k = k0; k <= k1; k++) if (mag[k] > mx) mx = mag[k];
    const sorted = Array.from(mag.subarray(k0, k1)).sort((a, b) => a - b);
    const floor = sorted[sorted.length >> 1] || 0;
    const out = [];
    for (let k = k0; k <= k1; k++) {
      const v = mag[k];
      if (v < mx * 0.03 || v < floor * 6) continue;
      if (!(v > mag[k - 1] && v >= mag[k + 1] && v >= mag[k - 2] && v >= mag[k + 2])) continue;
      const a = mag[k - 1], b = v, c = mag[k + 1], den = a - 2 * b + c;
      const dk = den ? 0.5 * (a - c) / den : 0;
      out.push({ f: (k + dk) * sr / N, a: v / mx });
    }
    return out;
  }
  const near = (f, g, cents) => Math.abs(1200 * Math.log2(f / g)) < cents;
  /* share of peak energy explained by the harmonic series of the given notes */
  function explain(pk, notes) {
    let tot = 0, got = 0; const left = [];
    for (const p of pk) {

  $('#strs').innerHTML = `<button data-s="-1" aria-pressed="${sel < 0}">Auto<small>any</small></button>` + N.map((n, i) => `<button data-s="${i}" aria-pressed="${sel === i}" class="${good.has(i) ? 'good' : ''}">${n}<small>${i === 0 ? 'low · 6' : i === 5 ? 'high · 1' : 'string ' + (6 - i)}</small></button>`).join('');
  $$('#strs button').forEach((b) => (b.onclick = () => { sel = +b.dataset.s; drawStrings(); if (sel >= 0) Audio.pluck(OPN()[sel], 0, 0.7); }));
}
function setTuning(t) {
  tun = t; good = new Set(); TU = DSP.makeTuner(OPN());
  $$('#tset button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.t === t));
  $('#tn').textContent = '–'; $('#tn').className = 'nn'; $('#th').textContent = ''; $('#tc').textContent = 'Pick a string, or just play one';
  drawStrings();
}
$$('#tset button').forEach((b) => (b.onclick = () => setTuning(b.dataset.t)));
const showReading = (m, how) => {
  const O = OPN(), N = TUNINGS[tun].names;
  const tgt = sel >= 0 ? sel : O.reduce((b, o, i) => (Math.abs(m - o) < Math.abs(m - O[b]) ? i : b), 0);
  last = tgt; const c = (m - O[tgt]) * 100;
  $('#needle').style.transform = `rotate(${clamp(c, -50, 50) * 1.6}deg)`;
  $('#tn').textContent = (tgt === 0 ? 'low ' : tgt === 5 ? 'high ' : '') + N[tgt]; $('#tn').className = 'nn ' + (Math.abs(c) <= 5 ? 'c-ok' : c < 0 ? 'c-low' : 'c-high');
  $('#tc').textContent = `string ${6 - tgt} · you're on ${DSP.name(m)} · ${centsTxt(c)}${how ? ' · ' + how : ''}`;
  const th = $('#th');
  if (Math.abs(c) > 350) { th.textContent = 'Far off — is this the right string?'; th.className = 'hint'; }
  else if (Math.abs(c) <= 5) { th.textContent = 'In tune ✓'; th.className = 'hint c-ok'; }
  else if (c < 0) { th.textContent = 'Too low — tighten slowly ↑'; th.className = 'hint c-low'; }
  else { th.textContent = 'Too high — loosen, then come back up'; th.className = 'hint c-high'; }
  return { tgt, c };
};
$('#ref').onclick = () => Audio.pluck(OPN()[sel >= 0 ? sel : last], 0, 0.7);

/* listen button + record-a-file fallback (from Strum & Sing) */
{
  const host = $('#lis');
  host.innerHTML = `<div class="row"><button class="btn" style="flex:1" data-l>Start listening</button></div>
  <div class="fallback hidden"><h3>Record and check</h3>
  <p>Live listening is switched off in this window. Pluck <b>one</b> string and record it for 3 seconds (camera video or Voice Memos), then pick the recording.</p>
  <label class="btn alt">Choose a recording<input type="file" accept="audio/*,video/*" class="vh"></label>
  <p class="sub" data-why style="margin-top:10px">For live tuning, open this app from its GitHub page (basic-afk.github.io/Guitar_Book) in Safari or Chrome, and allow the microphone.</p>
  <button class="btn ghost" data-retry style="margin-top:10px">Try the mic again</button></div>`;
  const b = $('[data-l]', host), fb = $('.fallback', host); let on = false;
  const setOn = (v) => { on = v; b.textContent = v ? 'Stop listening' : 'Start listening'; b.classList.toggle('on', v); };
  const start = () => { TU.reset(); loop(() => {
    const fr = Audio.micFrame(4096); if (!fr) return; const r = TU.read(fr.x, fr.sr, sel); if (!r.f0) return;
    const { tgt, c } = showReading(DSP.f2m(r.f0));
    if (Math.abs(c) <= 5) { if (++streakOk === 14 && !good.has(tgt)) { good.add(tgt); drawStrings(); toast(`String ${6 - tgt} (${TUNINGS[tun].names[tgt]}) is in tune`); } } else streakOk = 0;
  }); };
  b.onclick = async () => {
    if (on) { setOn(false); stopAll(); return; }
    Audio.ac(); const ok = await Audio.micStart();
    if (!ok) { fb.classList.remove('hidden'); b.disabled = true; b.textContent = 'Live mic not available here'; return; }
    setOn(true); start();
  };
  $('[data-retry]', fb).onclick = async () => { Audio.mic.blocked = false; Audio.mic.why = ''; b.disabled = false; const ok = await Audio.micStart(); if (ok) { fb.classList.add('hidden'); setOn(true); start(); } else { b.disabled = true; toast('Still no mic access'); } };
  $('input', fb).onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return; toast('Analysing your recording…');
    try {
      const a = await Audio.decodeFile(f);
      const ds = a.sr > 30000 ? 2 : 1, rate = a.sr / ds, T2 = DSP.makeTuner(OPN()), tr = [];
      for (let i = 0; i + 4096 * ds < a.x.length; i += Math.round(0.03 * a.sr)) { const fr = new Float32Array(4096); for (let j = 0; j < 4096; j++) fr[j] = ds === 2 ? 0.5 * (a.x[i + 2 * j] + a.x[i + 2 * j + 1]) : a.x[i + j]; const r = T2.read(fr, rate, sel); if (r.f0) tr.push(DSP.f2m(r.f0)); }
      tr.sort((x, y) => x - y);
      if (tr.length < 5) { toast('I couldn’t hear a clear note. Try again closer to the guitar.'); return; }
      const mid = tr.slice(Math.floor(tr.length * 0.2), Math.ceil(tr.length * 0.8)); showReading(mid[mid.length >> 1], 'from your recording');
    } catch (err) { toast('Couldn’t read that file. Try a voice memo (.m4a) or a video.'); }
    e.target.value = '';
  };
  leave = () => { if (on) { setOn(false); stopAll(); } };
}
drawStrings(); renderList();
{ const h = location.hash; if (ON_GH && /^#tuner/.test(h)) { setTuning(h === '#tuner-flat' ? 'flat' : 'std'); show('tune'); } }
}
</script>
</body></html>
